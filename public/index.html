<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PrismLive 直播间</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- ============ Phase A: 入口页 ============ -->
    <div id="entry-gate" class="phase">
        <div class="gate-card">
            <div class="gate-header">
                <div class="logo-dot"></div>
                <h1 class="gate-title">PrismLive</h1>
                <p class="gate-subtitle">私域直播 · 互动无间</p>
            </div>
            <form id="entry-form">
                <div class="form-group">
                    <label for="qq-input">QQ号</label>
                    <input type="text" id="qq-input" placeholder="请输入QQ号" maxlength="20" inputmode="numeric" autocomplete="off" required>
                    <div id="avatar-preview" class="avatar-preview hidden">
                        <img id="avatar-img" src="" alt="头像预览">
                    </div>
                </div>
                <div class="form-group">
                    <label for="name-input">昵称</label>
                    <input type="text" id="name-input" placeholder="输入 QQ 号后自动获取" maxlength="20" readonly autocomplete="off">
                </div>
                <button type="submit" id="join-btn" class="primary-btn">
                    <span class="btn-text">进入直播间</span>
                    <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- ============ Phase B: 直播间 ============ -->
    <div id="live-room" class="phase hidden">
        <!-- 断连横幅 -->
        <div id="disconnected-banner" class="disconnected-banner hidden">
            <span class="banner-icon"></span>
            <span id="banner-text">连接中断，重连中…</span>
        </div>

        <!-- 顶部信息栏 -->
        <header id="room-header" class="room-header">
            <img id="user-avatar" src="" alt="头像" class="header-avatar">
            <div class="header-info">
                <div class="title-row">
                    <span id="live-status-dot" class="live-status-dot offline"></span>
                    <div id="live-title" class="live-title">PrismLive 直播间</div>
                </div>
                <div id="live-announcement" class="live-announcement"></div>
            </div>
            <div class="online-badge" id="viewer-list-toggle" title="点击查看在线观众">
                <span class="online-dot"></span>
                <span id="online-count" class="online-count">0</span>
                <span class="online-label">在看</span>
                <span class="online-sep">·</span>
                <span class="peak-label">峰值</span>
                <span id="peak-count" class="peak-count">0</span>
            </div>
        </header>

        <!-- 在线观众列表面板 -->
        <div id="viewer-list-panel" class="viewer-list-panel hidden">
            <div class="viewer-list-header">
                <span class="viewer-list-title">在线观众</span>
                <span id="viewer-list-count" class="viewer-list-count">0</span>
                <button id="viewer-list-close" class="viewer-list-close" aria-label="关闭">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="viewer-list-body" class="viewer-list-body">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- 主内容区 -->
        <main id="main-content" class="main-content">
            <!-- 视频区 -->
            <div id="video-container" class="video-container">
                <!-- 骨架屏 (加载中显示) -->
                <div id="video-skeleton" class="video-skeleton hidden">
                    <div class="skeleton-shimmer"></div>
                </div>

                <!-- 直播播放器: 无原生控件, 自定义控制条 -->
                <video id="live-video" class="live-video" autoplay muted playsinline preload="auto"></video>

                <!-- 自定义播放器控制条 (直播: 禁暂停/禁seek) -->
                <div id="player-controls" class="player-controls hidden">
                    <!-- 左: 状态 + 时间 -->
                    <div class="controls-left">
                        <span id="pc-live-badge" class="pc-live-badge hidden">
                            <span class="pc-live-dot"></span>直播
                        </span>
                        <span id="pc-time" class="pc-time">--:--</span>
                        <span id="pc-delay" class="pc-delay hidden"></span>
                    </div>
                    <!-- 右: 音量 + 全屏 -->
                    <div class="controls-right">
                        <div class="pc-volume-wrap">
                            <button id="pc-mute-btn" class="pc-btn" title="静音 (M)" aria-label="静音">
                                <svg id="pc-vol-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
                                <svg id="pc-vol-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                            </button>
                            <input type="range" id="pc-volume" class="pc-volume-slider" min="0" max="100" value="100" title="音量">
                        </div>
                        <button id="pc-fullscreen-btn" class="pc-btn" title="全屏 (F)" aria-label="全屏">
                            <svg id="pc-fs-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
                            <svg id="pc-fs-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M8 3v3a2 2 0 01-2 2H3"/><path d="M21 8h-3a2 2 0 01-2-2V3"/><path d="M3 16h3a2 2 0 012 2v3"/><path d="M16 21v-3a2 2 0 012-2h3"/></svg>
                        </button>
                    </div>
                </div>

                <!-- 缓冲状态覆盖层 (转圈时显示, 消除"黑屏无反馈") -->
                <div id="buffer-overlay" class="buffer-overlay hidden">
                    <div class="buffer-spinner"></div>
                    <div class="buffer-text" id="buffer-text">缓冲中…</div>
                </div>

                <!-- 手动追帧按钮 (直播延迟过大时点击跳到最新) -->
                <button id="catch-up-btn" class="catch-up-btn hidden" title="跳到直播最新画面">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>追上直播</span>
                </button>

                <!-- LIVE 徽章 -->
                <div id="live-badge" class="live-badge hidden">
                    <span class="live-badge-dot"></span>
                    <span>LIVE</span>
                </div>

                <!-- 弹幕显示设置按钮 -->
                <button id="danmaku-settings-btn" class="video-overlay-btn danmaku-settings-btn" title="弹幕设置" aria-label="弹幕设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                </button>

                <!-- 弹幕设置面板 -->
                <div id="danmaku-settings-panel" class="danmaku-settings-panel hidden">
                    <div class="settings-panel-header">弹幕设置</div>
                    <div class="settings-row">
                        <span class="settings-label">字号</span>
                        <div class="segmented-control" id="font-size-control">
                            <button data-size="small">小</button>
                            <button data-size="medium" class="active">中</button>
                            <button data-size="large">大</button>
                        </div>
                    </div>
                    <div class="settings-row">
                        <span class="settings-label">透明度</span>
                        <input type="range" id="danmaku-opacity" min="30" max="100" value="100" class="settings-slider">
                        <span id="opacity-value" class="settings-value">100%</span>
                    </div>
                    <div class="settings-row">
                        <span class="settings-label">显示区域</span>
                        <div class="segmented-control" id="area-control">
                            <button data-area="half">上半屏</button>
                            <button data-area="full" class="active">全屏</button>
                        </div>
                    </div>
                </div>

                <!-- 未开播占位 -->
                <div id="not-streaming" class="not-streaming hidden">
                    <div class="not-streaming-content">
                        <div class="not-streaming-icon">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <defs>
                                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style="stop-color:#7c5cff;stop-opacity:1" />
                                        <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
                                    </linearGradient>
                                </defs>
                                <rect x="2" y="7" width="20" height="13" rx="2"/>
                                <path d="M8 20.5l4-4 4 4"/>
                                <path d="M12 16.5V12"/>
                                <path d="M7 9h10"/>
                            </svg>
                        </div>
                        <h3 id="not-streaming-title">主播还没开播</h3>
                        <p id="not-streaming-desc">请稍后再来，或等待主播开播通知</p>
                        <button id="back-to-gate" class="ghost-btn">返回入口</button>
                    </div>
                </div>

                <!-- 弹幕层 -->
                <div id="danmaku-overlay" class="danmaku-overlay"></div>

                <!-- 点赞气泡 -->
                <div id="like-bubbles" class="like-bubbles"></div>

                <!-- 系统消息 -->
                <div id="system-messages" class="system-messages"></div>
            </div>

            <!-- 聊天列表 -->
            <div id="chat-container" class="chat-container">
                <div id="chat-list" class="chat-list">
                    <div class="empty-state">
                        <svg class="empty-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        <div class="empty-text">还没有弹幕，来发第一条吧</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部输入栏 -->
        <div id="danmaku-input-container" class="danmaku-input-container">
            <button id="like-btn" class="like-btn" title="点赞" aria-label="点赞">
                <span class="like-icon">❤️</span>
                <span id="like-count" class="like-count">0</span>
            </button>

            <div class="input-wrapper">
                <input type="text" id="danmaku-input" placeholder="发条弹幕聊聊吧..." maxlength="100" autocomplete="off">

                <!-- 颜色选择按钮 -->
                <button id="color-btn" class="input-tool-btn color-btn" title="弹幕颜色" aria-label="弹幕颜色">
                    <span id="current-color-dot" class="color-dot current"></span>
                </button>

                <!-- 表情按钮 -->
                <button id="emoji-btn" class="input-tool-btn emoji-btn" title="表情" aria-label="表情">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                </button>

                <!-- 颜色调色板 -->
                <div id="color-palette" class="color-palette hidden"></div>

                <!-- 表情面板 -->
                <div id="emoji-panel" class="emoji-panel hidden"></div>
            </div>

            <button id="send-btn" class="send-btn">发送</button>
        </div>
        <div id="danmaku-disabled" class="danmaku-disabled hidden">弹幕功能已关闭</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/hls.js/hls.min.js"></script>
    <script src="/vendor/mpegts.js/mpegts.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
